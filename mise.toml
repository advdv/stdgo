
[settings]
go.set_gobin = false
minimum_release_age_excludes = ["amp"]

[tools]
amp = { version = "latest", allow_builds = ["@ampcode/cli"] }
# golangci-lint must be listed before go so it takes precedence on PATH
# over any binary installed via `go install`
golangci-lint = "latest"
go = "latest"
mage = "latest"
node = "lts"
buf = "latest"
claude = "latest"
